services:
  mysql:
    image: mysql:8.4
    container_name: itsm-ai-evaluator-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-itsm_ai_evaluator}
      MYSQL_USER: ${MYSQL_USER:-itsm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-itsm_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "3307:3306"
    volumes:
      - itsm_ai_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  itsm_ai_mysql_data:
